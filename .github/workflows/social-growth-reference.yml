name: Real Qwen3 additive social population growth
on:
  pull_request:
    paths:
      - 'src/vibeweights/social_revisions.py'
      - 'src/vibeweights/social_learning.py'
      - 'scripts/probe_local_learning.py'
      - '.github/workflows/social-growth-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: social-growth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUTF8: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install safetensors==0.7.0
          python -m pip install -e ".[fragments]"
          python -m pip check
      - name: Admit local learning candidate and extend existing population
        run: python scripts/probe_local_learning.py --download-pinned-qwen3 --output social-growth --growth
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: social-growth-evidence
          path: |
            social-growth/report.json
            social-growth/usage.sqlite
            social-growth/*/manifest.json
            social-growth/*/adapter.safetensors
          if-no-files-found: warn
