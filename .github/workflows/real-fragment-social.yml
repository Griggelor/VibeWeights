name: Real Qwen3 fragment social reference
on:
  pull_request:
    paths:
      - 'src/vibeweights/fragment_social_ports.py'
      - 'src/vibeweights/social_learning.py'
      - 'src/vibeweights/fragment_adapters.py'
      - 'scripts/probe_real_fragment_social.py'
      - '.github/workflows/real-fragment-social.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: real-fragment-social-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUTF8: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU and fragment dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install safetensors==0.7.0
          python -m pip install -e ".[fragments]"
          python -m pip check
      - name: Admit readouts then run social experiment without full teacher
        run: python scripts/probe_real_fragment_social.py --download-pinned-qwen3 --output fragment-social --device cpu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-fragment-social-evidence
          path: |
            fragment-social/report.json
            fragment-social/readouts.json
            fragment-social/*/manifest.json
            fragment-social/*/adapter.safetensors
          if-no-files-found: warn
