name: Qwen3 frozen fragment adapter A1
on:
  pull_request:
    paths:
      - 'src/vibeweights/fragment_adapters.py'
      - 'src/vibeweights/qwen3_fragments.py'
      - 'scripts/probe_fragment_adapters.py'
      - '.github/workflows/fragment-adapter-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fragment-a1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  controlled-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUTF8: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU and fragment dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install safetensors==0.7.0
          python -m pip install -e ".[fragments]"
          python -m pip check
      - name: Run prespecified task and controls without teacher model
        run: python scripts/probe_fragment_adapters.py --download-pinned-qwen3 --output fragment-a1 --device cpu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen3-a1-results
          path: |
            fragment-a1/report.json
            fragment-a1/pretrained/manifest.json
            fragment-a1/pretrained/adapter.safetensors
            fragment-a1/random/manifest.json
            fragment-a1/random/adapter.safetensors
            fragment-a1/embedding-only/manifest.json
            fragment-a1/embedding-only/adapter.safetensors
          if-no-files-found: warn
