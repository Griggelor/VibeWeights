name: Real fragment isolated activation credit
on:
  pull_request:
    paths:
      - 'src/vibeweights/social_learning.py'
      - 'scripts/probe_social_credit.py'
      - 'scripts/probe_real_fragment_social.py'
      - '.github/workflows/social-credit-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: social-credit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUTF8: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU and fragment dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install safetensors==0.7.0
          python -m pip install -e ".[fragments]"
          python -m pip check
      - name: Compare original and isolated credit on fresh held-out tasks
        run: python scripts/probe_social_credit.py --download-pinned-qwen3 --output credit-comparison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-credit-evidence
          path: |
            credit-comparison/report.json
            credit-comparison/*/manifest.json
            credit-comparison/*/adapter.safetensors
          if-no-files-found: warn
