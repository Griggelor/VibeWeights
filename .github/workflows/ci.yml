name: VibeWeights CPU CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install safetensors==0.7.0 pytest==9.0.2
          python -m pip install -e . --no-deps
      - name: Verify checked-in weights and run suite
        run: python -m pytest -q --junitxml=ci-results.xml
      - name: Rebuild weights and verify no changes
        run: |
          python scripts/build_weights.py
          python scripts/build_language_weights.py
          python scripts/build_coalition_weights.py
          git diff --exit-code -- artifacts/weights artifacts/language artifacts/coalition catalog/manifests
      - name: Language CLI smoke test
        run: python -m vibeweights --text "Multipliziere 7 mit 6 und vergleiche mit 30."
      - name: Application smoke test
        run: python -m vibeweights.chat --ask "Ist 7 mal 6 mindestens 30?"
      - name: Exploration smoke test
        run: python -m vibeweights.chat --shots 4 --shot-seed 0 --ask "Ist 3 mindestens 4?"
      - name: Environment v0.6 smoke test
        run: python -m vibeweights.next demo 7
      - name: Environment v0.7 memory smoke test
        run: |
          python -m vibeweights.next memory-demo 7 --initialize --remember
          python -m vibeweights.next memory-demo -7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-py${{ matrix.python }}
          path: ci-results.xml
          if-no-files-found: warn
