name: Real Qwen3 usage adapter transfer
on:
  pull_request:
    paths:
      - 'src/vibeweights/usage_adapters.py'
      - 'src/vibeweights/fragment_adapters.py'
      - 'scripts/probe_usage_adapter.py'
      - '.github/workflows/usage-adapter-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: usage-adapter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUTF8: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU and fragment dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install safetensors==0.7.0
          python -m pip install -e ".[fragments]"
          python -m pip check
      - name: Learn new adapter from committed social-use receipts
        run: python scripts/probe_usage_adapter.py --download-pinned-qwen3 --output usage-adapter
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usage-adapter-evidence
          path: |
            usage-adapter/report.json
            usage-adapter/usage.sqlite
            usage-adapter/*/manifest.json
            usage-adapter/*/adapter.safetensors
          if-no-files-found: warn
