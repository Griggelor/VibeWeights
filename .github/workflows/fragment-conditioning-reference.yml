name: Qwen3 latent conditioning A1 follow-up
on:
  pull_request:
    paths:
      - 'src/vibeweights/fragment_adapters.py'
      - 'scripts/probe_fragment_conditioning.py'
      - '.github/workflows/fragment-conditioning-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fragment-conditioning-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  controlled-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUTF8: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU and fragment dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install safetensors==0.7.0
          python -m pip install -e ".[fragments]"
          python -m pip check
      - name: Run prespecified factorial and scale controls
        run: python scripts/probe_fragment_conditioning.py --download-pinned-qwen3 --output fragment-a1-followup --device cpu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen3-a1-followup-results
          path: |
            fragment-a1-followup/report.json
            fragment-a1-followup/partial-report.json
            fragment-a1-followup/*/adapter.safetensors
            fragment-a1-followup/*/manifest.json
          if-no-files-found: warn
