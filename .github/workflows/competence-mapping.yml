name: Qwen3 competence mapping
on:
  pull_request:
    paths:
      - 'src/vibeweights/competence_mapping.py'
      - 'scripts/probe_competence_mapping.py'
      - '.github/workflows/competence-mapping.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: competence-mapping-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUTF8: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU and fragment dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install safetensors==0.7.0
          python -m pip install -e ".[fragments]"
          python -m pip check
      - name: Profile and reversibly bypass regions on pinned Qwen3
        run: python scripts/probe_competence_mapping.py --download-pinned-qwen3 --report mapping/report.json --device cpu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen3-competence-map
          path: mapping/report.json
          if-no-files-found: warn
